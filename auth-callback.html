<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Authenticating... - Team Profile Hub</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }
    .container {
      text-align: center;
      padding: 40px;
    }
    .spinner {
      width: 60px;
      height: 60px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 800ms linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 { font-size: 24px; margin-bottom: 12px; font-weight: 600; }
    p { font-size: 16px; opacity: 0.9; }
    .error {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.5);
      padding: 20px;
      border-radius: 12px;
      margin-top: 20px;
    }
    .btn {
      margin-top: 20px;
      padding: 12px 24px;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
      border-radius: 8px;
      text-decoration: none;
      display: inline-block;
      cursor: pointer;
      transition: all 200ms;
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h1>Completing Sign In...</h1>
    <p id="status">Please wait while we authenticate your account</p>
    <div id="error" class="error" style="display: none;"></div>
    <a href="/auth.html" class="btn" id="backBtn" style="display: none;">Back to Sign In</a>
  </div>

  <script>
    const API_BASE = window.location.hostname === 'localhost' ? 'http://localhost:3001/api' : '/api';
    
    async function handleCallback() {
      try {
        // Initialize Supabase
        if (typeof window.supabase === 'undefined' || !window.SUPABASE_URL || !window.SUPABASE_ANON_KEY) {
          throw new Error('Supabase not configured. Please update config.js');
        }
        
        const supabase = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
        
        // Get session from URL hash
        const { data: { session }, error } = await supabase.auth.getSession();
        
        if (error) throw error;
        
        if (!session) {
          throw new Error('No session found. Please try signing in again.');
        }
        
        document.getElementById('status').textContent = 'Verifying your account...';
        
        // Get user profile from backend
        const response = await fetch(`${API_BASE}/auth/me`, {
          headers: {
            'Authorization': `Bearer ${session.access_token}`,
            'Content-Type': 'application/json'
          }
        });
        
        if (!response.ok) {
          throw new Error('Failed to verify account');
        }
        
        const userData = await response.json();
        
        // Save to localStorage
        localStorage.setItem('tph_access_token', session.access_token);
        localStorage.setItem('tph_user_info', JSON.stringify({
          user: userData.user,
          profile: userData.profile
        }));
        
        document.getElementById('status').textContent = 'Success! Redirecting to dashboard...';
        
        // Redirect to main app
        setTimeout(() => {
          window.location.href = '/';
        }, 1000);
        
      } catch (err) {
        console.error('[AUTH] Callback error:', err);
        document.querySelector('.spinner').style.display = 'none';
        document.getElementById('status').style.display = 'none';
        document.getElementById('error').style.display = 'block';
        document.getElementById('error').textContent = err.message || 'Authentication failed';
        document.getElementById('backBtn').style.display = 'inline-block';
      }
    }
    
    // Run callback handler
    handleCallback();
  </script>
</body>
</html>
