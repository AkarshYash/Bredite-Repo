<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Team Profile Hub · Full CRUD</title>
    <!-- Bootstrap 5 + Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <style>
        /* ─── CSS Variables (Light & Dark) ─── */
        
         :root {
            --bg-body: #f4f6fb;
            --bg-card: #ffffff;
            --bg-header: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
            --panel-bg: #ffffff;
            --tab-bg: #f1f5f9;
            --tab-active: #eef2ff;
            --tab-text: #1e40af;
            --input-bg: rgba(255, 255, 255, 0.08);
            --input-border: rgba(255, 255, 255, 0.10);
            --input-placeholder: #94a3b8;
            --badge-visa: #dcfce7;
            --badge-visa-text: #166534;
            --ref-bg: #f8fafc;
            --ref-border: #60a5fa;
            --doc-bg: #f8fafc;
            --doc-border: #e9edf4;
            --social-bg: #f1f5f9;
            --footer-border: #e9edf4;
            --modal-bg: #ffffff;
            --modal-input-bg: #ffffff;
        }
        
        .dark-theme {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --bg-header: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
            --panel-bg: #1e293b;
            --tab-bg: #334155;
            --tab-active: #475569;
            --tab-text: #93c5fd;
            --input-bg: rgba(255, 255, 255, 0.05);
            --input-border: rgba(255, 255, 255, 0.08);
            --input-placeholder: #64748b;
            --badge-visa: #1e3a5f;
            --badge-visa-text: #93c5fd;
            --ref-bg: #2d3748;
            --ref-border: #60a5fa;
            --doc-bg: #2d3748;
            --doc-border: #475569;
            --social-bg: #2d3748;
            --footer-border: #334155;
            --modal-bg: #1e293b;
            --modal-input-bg: #2d3748;
        }
        /* ─── RESET & BASE ─── */
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-body);
            color: var(--text-primary);
            padding: 24px 16px 60px;
            transition: background 0.3s, color 0.3s;
        }
        
        .container {
            max-width: 1320px;
        }
        /* ─── HEADER ─── */
        
        .app-header {
            background: var(--bg-header);
            border-radius: 24px;
            padding: 24px 32px;
            margin-bottom: 28px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 12px 40px rgba(15, 23, 42, 0.25);
            transition: background 0.3s;
        }
        
        .app-header h1 {
            font-weight: 700;
            font-size: 1.75rem;
            color: #fff;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .app-header h1 i {
            color: #60a5fa;
            font-size: 2rem;
        }
        
        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .header-actions .search-box {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 40px;
            padding: 8px 18px 8px 20px;
            color: #fff;
            width: 220px;
            transition: 0.25s;
        }
        
        .header-actions .search-box::placeholder {
            color: var(--input-placeholder);
        }
        
        .header-actions .search-box:focus {
            background: rgba(255, 255, 255, 0.14);
            outline: none;
            border-color: #60a5fa;
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.20);
        }
        
        .header-actions .btn-outline-light {
            border-color: rgba(255, 255, 255, 0.20);
            color: #e2e8f0;
        }
        
        .header-actions .btn-outline-light:hover {
            background: rgba(255, 255, 255, 0.10);
            border-color: #fff;
            color: #fff;
        }
        
        .theme-toggle {
            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #e2e8f0;
            border-radius: 40px;
            padding: 6px 16px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.20);
        }
        
        .btn-primary-custom {
            background: #60a5fa;
            border: none;
            color: #0f172a;
            font-weight: 500;
        }
        
        .btn-primary-custom:hover {
            background: #3b82f6;
            color: #fff;
        }
        /* ─── TEAM GRID ─── */
        
        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }
        
        .person-card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 24px 24px 28px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.3s, border 0.3s;
            cursor: pointer;
            position: relative;
            animation: cardFadeIn 0.5s ease both;
        }
        
        .person-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
            border-color: #60a5fa;
        }
        
        .person-card .avatar {
            width: 64px;
            height: 64px;
            border-radius: 18px;
            background: linear-gradient(135deg, #eef2ff, #e0e7ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.6rem;
            color: #1e40af;
            margin-bottom: 16px;
        }
        
        .dark-theme .person-card .avatar {
            background: linear-gradient(135deg, #2d3748, #4a5568);
            color: #93c5fd;
        }
        
        .person-card h3 {
            font-weight: 700;
            font-size: 1.3rem;
            margin-bottom: 4px;
            letter-spacing: -0.01em;
        }
        
        .person-card .subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .person-card .subtitle .badge-visa {
            background: var(--badge-visa);
            color: var(--badge-visa-text);
            font-weight: 500;
            font-size: 0.7rem;
            padding: 2px 12px;
            border-radius: 20px;
        }
        
        .person-card .quick-info {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 12px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            border-top: 1px solid var(--border-color);
            padding-top: 14px;
            margin-top: 6px;
        }
        
        .person-card .quick-info span {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .person-card .quick-info i {
            color: #94a3b8;
            font-size: 0.9rem;
        }
        
        .person-card .click-hint {
            position: absolute;
            bottom: 16px;
            right: 20px;
            color: var(--text-secondary);
            font-size: 0.75rem;
            opacity: 0.6;
        }
        
        @keyframes cardFadeIn {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        /* ─── PROFILE PANEL ─── */
        
        .profile-panel {
            background: var(--panel-bg);
            border-radius: 24px;
            padding: 32px 36px 40px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            margin-top: 12px;
            display: none;
            animation: fadeSlide 0.35s ease;
            transition: background 0.3s, border 0.3s;
        }
        
        .profile-panel.active {
            display: block;
        }
        
        @keyframes fadeSlide {
            0% {
                opacity: 0;
                transform: translateY(16px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .profile-panel .profile-header {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 28px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .profile-panel .profile-header .name-title h2 {
            font-weight: 700;
            font-size: 2rem;
            letter-spacing: -0.02em;
            margin-bottom: 2px;
        }
        
        .profile-panel .profile-header .name-title .role-tag {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }
        
        .profile-panel .profile-header .action-buttons {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .profile-panel .profile-header .action-buttons .btn-icon {
            background: var(--tab-bg);
            border: none;
            border-radius: 40px;
            padding: 8px 16px;
            font-weight: 500;
            color: var(--text-primary);
            transition: 0.20s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        
        .profile-panel .profile-header .action-buttons .btn-icon:hover {
            background: var(--border-color);
        }
        
        .profile-panel .profile-header .action-buttons .btn-icon.danger:hover {
            background: #fecaca;
            color: #b91c1c;
        }
        /* Tabs */
        
        .profile-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 28px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 4px;
        }
        
        .profile-tabs .tab-btn {
            background: transparent;
            border: none;
            padding: 10px 20px;
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--text-secondary);
            border-radius: 40px;
            transition: 0.20s;
            cursor: pointer;
        }
        
        .profile-tabs .tab-btn:hover {
            background: var(--tab-bg);
            color: var(--text-primary);
        }
        
        .profile-tabs .tab-btn.active {
            background: var(--tab-active);
            color: var(--tab-text);
            font-weight: 600;
        }
        
        .dark-theme .profile-tabs .tab-btn.active {
            background: #475569;
            color: #93c5fd;
        }
        
        .tab-content {
            display: none;
            animation: fadeSlide 0.25s ease;
        }
        
        .tab-content.active {
            display: block;
        }
        /* Info Grid */
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 18px 28px;
        }
        
        .info-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 6px 0;
            border-bottom: 1px dashed var(--border-color);
        }
        
        .info-item .label {
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-secondary);
        }
        
        .info-item .value {
            font-size: 0.98rem;
            font-weight: 500;
            color: var(--text-primary);
            word-break: break-word;
        }
        
        .info-item .value.small {
            font-size: 0.88rem;
            font-weight: 400;
        }
        /* References */
        
        .ref-item {
            background: var(--ref-bg);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 8px;
            border-left: 4px solid var(--ref-border);
            transition: background 0.3s;
        }
        
        .ref-item .ref-name {
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .ref-item .ref-detail {
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: flex;
            flex-wrap: wrap;
            gap: 4px 16px;
        }
        
        .ref-item .ref-detail i {
            color: #94a3b8;
            width: 18px;
        }
        /* Docs & Social */
        
        .doc-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 20px;
            margin-top: 8px;
        }
        
        .doc-grid .doc-item {
            background: var(--doc-bg);
            padding: 10px 18px 10px 16px;
            border-radius: 40px;
            border: 1px solid var(--doc-border);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            transition: 0.20s;
            text-decoration: none;
            color: var(--text-primary);
            cursor: pointer;
        }
        
        .doc-grid .doc-item:hover {
            background: var(--border-color);
            border-color: #60a5fa;
        }
        
        .doc-grid .doc-item i {
            font-size: 1.2rem;
            color: var(--text-secondary);
        }
        
        .social-links {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 6px;
        }
        
        .social-links a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px 8px 16px;
            border-radius: 40px;
            background: var(--social-bg);
            color: var(--text-primary);
            text-decoration: none;
            font-size: 0.9rem;
            transition: 0.20s;
            border: 1px solid transparent;
            cursor: pointer;
        }
        
        .social-links a:hover {
            background: var(--border-color);
            border-color: #60a5fa;
        }
        
        .social-links a i {
            font-size: 1.1rem;
        }
        /* ─── CLICK ANIMATION ─── */
        
        .click-pop {
            animation: popAnim 0.3s ease;
        }
        
        @keyframes popAnim {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.08);
                background: #60a5fa;
                color: #fff;
            }
            100% {
                transform: scale(1);
            }
        }
        /* ─── MODAL (Add/Edit) ─── */
        
        .modal-content {
            background: var(--modal-bg);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }
        
        .modal-header,
        .modal-footer {
            border-color: var(--border-color);
        }
        
        .modal .btn-close {
            filter: var(--btn-close-filter, none);
        }
        
        .dark-theme .modal .btn-close {
            filter: invert(1) grayscale(100%) brightness(200%);
        }
        
        .form-control,
        .form-select {
            background: var(--modal-input-bg);
            border-color: var(--border-color);
            color: var(--text-primary);
        }
        
        .form-control:focus {
            background: var(--modal-input-bg);
            border-color: #60a5fa;
            box-shadow: 0 0 0 0.2rem rgba(96, 165, 250, 0.25);
            color: var(--text-primary);
        }
        
        .form-label {
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 500;
        }
        
        .modal-body {
            max-height: 70vh;
            overflow-y: auto;
        }
        /* ─── RESPONSIVE ─── */
        
        @media (max-width: 768px) {
            .app-header {
                padding: 20px;
                flex-direction: column;
                align-items: stretch;
                gap: 16px;
            }
            .app-header h1 {
                font-size: 1.4rem;
            }
            .header-actions {
                flex-wrap: wrap;
            }
            .header-actions .search-box {
                width: 100%;
            }
            .profile-panel {
                padding: 20px 16px 28px;
            }
            .profile-panel .profile-header .name-title h2 {
                font-size: 1.5rem;
            }
            .profile-panel .profile-header .action-buttons {
                margin-top: 12px;
                width: 100%;
            }
            .info-grid {
                grid-template-columns: 1fr;
            }
            .team-grid {
                grid-template-columns: 1fr;
            }
        }
        /* ─── MISC ─── */
        
        .empty-state {
            color: var(--text-secondary);
            text-align: center;
            padding: 40px 20px;
        }
        
        .text-muted-light {
            color: var(--text-secondary);
        }
        
        .form-section-title {
            font-weight: 600;
            margin-top: 16px;
            margin-bottom: 8px;
            padding-bottom: 4px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
        }
        
        .form-section-title i {
            margin-right: 8px;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- ═══ HEADER ═══ -->
        <header class="app-header">
            <div>
                <h1>
                    <i class="bi bi-people-fill"></i> Team Profile Hub
                </h1>
                <div style="color:#94a3b8; font-size:0.85rem; margin-top:2px;">
                    <i class="bi bi-dot"></i> US IT Consultants &nbsp;·&nbsp; <span id="memberCount">0</span> members
                </div>
            </div>
            <div class="header-actions">
                <input type="text" class="search-box" id="searchInput" placeholder="🔍  Search members..." />
                <button class="btn btn-outline-light btn-sm" id="resetSearchBtn" title="Clear search">
                    <i class="bi bi-x-lg"></i>
                </button>
                <button class="theme-toggle" id="themeToggle">
                    <i class="bi bi-moon-stars" id="themeIcon"></i> <span id="themeLabel">Dark</span>
                </button>
                <button class="btn btn-primary-custom btn-sm" data-bs-toggle="modal" data-bs-target="#profileModal" id="addNewBtn">
                    <i class="bi bi-person-plus"></i> Add
                </button>
            </div>
        </header>

        <!-- ═══ TEAM GRID ═══ -->
        <div class="team-grid" id="teamGrid">
            <!-- Cards injected by JavaScript -->
        </div>

        <!-- ═══ PROFILE DETAIL PANEL ═══ -->
        <div class="profile-panel" id="profilePanel">
            <div class="profile-header">
                <div class="name-title">
                    <h2 id="detailName">—</h2>
                    <div class="role-tag" id="detailSubtitle">
                        <span class="badge-visa" id="detailVisaBadge" style="padding:2px 14px;border-radius:40px;font-weight:500;font-size:0.75rem;">—</span>
                        <span id="detailLocation" style="margin-left:10px;"><i class="bi bi-geo-alt"></i> —</span>
                    </div>
                </div>
                <div class="action-buttons">
                    <button class="btn-icon" id="editProfileBtn"><i class="bi bi-pencil"></i> Edit</button>
                    <button class="btn-icon danger" id="deleteProfileBtn"><i class="bi bi-trash"></i> Delete</button>
                    <button class="btn-icon" id="closePanelBtn"><i class="bi bi-arrow-left"></i> Back</button>
                </div>
            </div>

            <!-- Tabs -->
            <div class="profile-tabs" id="profileTabs">
                <button class="tab-btn active" data-tab="tabOverview">📋 Overview</button>
                <button class="tab-btn" data-tab="tabPersonal">👤 Personal</button>
                <button class="tab-btn" data-tab="tabVisa">🛂 Visa &amp; Work</button>
                <button class="tab-btn" data-tab="tabProfessional">💼 Professional</button>
                <button class="tab-btn" data-tab="tabUS">🇺🇸 US History</button>
                <button class="tab-btn" data-tab="tabDocs">📎 Docs &amp; Links</button>
            </div>

            <!-- Tab Contents -->
            <div id="tabOverview" class="tab-content active">
                <div class="info-grid" id="overviewGrid"></div>
            </div>
            <div id="tabPersonal" class="tab-content">
                <div class="info-grid" id="personalGrid"></div>
            </div>
            <div id="tabVisa" class="tab-content">
                <div class="info-grid" id="visaGrid"></div>
            </div>
            <div id="tabProfessional" class="tab-content">
                <div class="info-grid" id="professionalGrid"></div>
            </div>
            <div id="tabUS" class="tab-content">
                <div class="info-grid" id="usGrid"></div>
            </div>
            <div id="tabDocs" class="tab-content">
                <div id="docsContent"></div>
            </div>
        </div>

        <!-- ═══ ADD/EDIT MODAL ═══ -->
        <div class="modal fade" id="profileModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-xl">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="modalTitle"><i class="bi bi-person-plus me-2"></i>Add New Member</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form id="profileForm">
                            <input type="hidden" id="editId" value="">
                            <!-- Personal Info -->
                            <div class="form-section-title"><i class="bi bi-person"></i>Personal Information</div>
                            <div class="row g-3">
                                <div class="col-md-6"><label class="form-label">Full Name *</label><input type="text" class="form-control" id="fName" required></div>
                                <div class="col-md-6"><label class="form-label">Email *</label><input type="email" class="form-control" id="fEmail" required></div>
                                <div class="col-md-6"><label class="form-label">Phone</label><input type="text" class="form-control" id="fPhone"></div>
                                <div class="col-md-6"><label class="form-label">Address</label><input type="text" class="form-control" id="fAddress"></div>
                                <div class="col-md-6"><label class="form-label">Date of Birth (Age)</label><input type="text" class="form-control" id="fAge" placeholder="e.g. 30"></div>
                                <div class="col-md-6"><label class="form-label">Education</label><input type="text" class="form-control" id="fEducation"></div>
                                <div class="col-md-6"><label class="form-label">DL Name (as per license)</label><input type="text" class="form-control" id="fDlName"></div>
                                <div class="col-md-6"><label class="form-label">Marriage Date</label><input type="text" class="form-control" id="fMarriage" placeholder="e.g. 2019"></div>

        // Load data from localStorage, merge missing default profiles if any
        function loadData() {
            const stored = localStorage.getItem(STORAGE_KEY);
            let data = [];
            if (stored) {
                try {
                    const parsed = JSON.parse(stored);
                    if (Array.isArray(parsed) && parsed.length) {
                        data = parsed;
                    }
                } catch (e) {}
            }
            // If no data, use default
            if (!data || data.length === 0) {
                data = defaultData;
                saveData(data);
                return data;
            }
            // Merge: add any default profiles that are not in stored (by id)
            const existingIds = new Set(data.map(p => p.id));
            let added = false;
            defaultData.forEach(dp => {
                if (!existingIds.has(dp.id)) {
                    data.push(dp);
                    added = true;
                }
            });
            if (added) {
                saveData(data);
            }
            return data;
        }

        function saveData(data) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        function renderCards(filter = '') {
            const q = filter.trim().toLowerCase();
            const filtered = teamData.filter(p =>
                p.name.toLowerCase().includes(q) ||
                p.gmail.toLowerCase().includes(q) ||
                p.lastCompany.toLowerCase().includes(q) ||
                p.visaType.toLowerCase().includes(q)

            memberCountSpan.textContent = filtered.length;

            if (filtered.length === 0) {
                teamGrid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">
                    <i class="bi bi-search" style="font-size:2rem;display:block;margin-bottom:8px;"></i>
                    No members match “${filter.trim()}”
                </div>`;
                return;
            }

            teamGrid.innerHTML = filtered.map((p, index) => `
                <div class="person-card" data-id="${p.id}" style="animation-delay: ${index * 0.05}s">
                    <div class="avatar">${p.name.split(' ').map(n => n[0]).join('')}</div>
                    <h3>${p.name}</h3>
                    <div class="subtitle">
                        <span>${p.lastCompany}</span>

                        <span><i class="bi bi-geo-alt"></i> ${p.currentLocation}</span>

                    </div>
                    <div class="click-hint"><i class="bi bi-chevron-right"></i> view profile</div>
                </div>
            `).join('');

            document.querySelectorAll('.person-card').forEach(card => {
                card.addEventListener('click', () => {
                    const id = parseInt(card.dataset.id);
                    const person = teamData.find(p => p.id === id);
                    if (person) openProfile(person);
                });
            });
        }

        const tabBtns = document.querySelectorAll('.tab-btn');
        const tabContents = {
            overview: document.getElementById('tabOverview'),
            personal: document.getElementById('tabPersonal'),
            visa: document.getElementById('tabVisa'),
            professional: document.getElementById('tabProfessional'),
            us: document.getElementById('tabUS'),
            docs: document.getElementById('tabDocs')

        let currentPerson = null;

        function openProfile(person) {
            currentPerson = person;
            profilePanel.classList.add('active');
            profilePanel.scrollIntoView({
                behavior: 'smooth',
                block: 'start'
            });

            detailName.textContent = person.name;
            detailVisaBadge.textContent = person.visaType;
            detailVisaBadge.style.background = 'var(--badge-visa)';
            detailVisaBadge.style.color = 'var(--badge-visa-text)';
            detailLocation.innerHTML = `<i class="bi bi-geo-alt"></i> ${person.currentLocation}`;

            populateOverview(person);
            populatePersonal(person);
            populateVisa(person);
            populateProfessional(person);
            populateUS(person);
            populateDocs(person);

            activateTab('tabOverview');
        }

        function closeProfile() {
            profilePanel.classList.remove('active');
            currentPerson = null;
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        }

        closePanelBtn.addEventListener('click', closeProfile);

            if (!currentPerson) return;
            openEditModal(currentPerson);

                activateTab(tabId);
            });
        });

        function activateTab(tabId) {
            tabBtns.forEach(b => b.classList.remove('active'));
            document.querySelector(`.tab-btn[data-tab="${tabId}"]`).classList.add('active');
            Object.keys(tabContents).forEach(key => {
                tabContents[key].classList.remove('active');
            });
            const target = tabContents[tabId.replace('tab', '').toLowerCase()];
            if (target) target.classList.add('active');
        }

        // Populate functions
        function buildGrid(containerId, fields) {
            const container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = fields.map(f => {
                        if (Array.isArray(f.value) && f.label === 'References') {
                            const refs = f.value;
                            if (!refs.length) return `<div class="info-item"><span class="label">References</span><span class="value">No references provided</span></div>`;
                            let html = `<div class="info-item"><span class="label">References</span><div class="value ref-list">`;
                            refs.forEach(r => {
                                        html += `
                            <div class="ref-item">
                                <div class="ref-name">${r.name}</div>
                                <div class="ref-detail">
                                    <span><i class="bi bi-briefcase"></i> ${r.designation} at ${r.company}</span>
                                    ${r.email ? `<span><i class="bi bi-envelope"></i> ${r.email}</span>` : ''}
                                    ${r.phone ? `<span><i class="bi bi-phone"></i> ${r.phone}</span>` : ''}
                                    ${r.linkedin ? `<span><i class="bi bi-linkedin"></i> <a href="https://${r.linkedin}" target="_blank">${r.linkedin}</a></span>` : ''}
                                </div>
                            </div>
                        `;
                    });
                    html += `</div></div>`;
                    return html;
                }
                return `
                    <div class="info-item">
                        <span class="label">${f.label}</span>
                        <span class="value ${f.small ? 'small' : ''}">${f.value || '—'}</span>
                    </div>
                `;
            }).join('');
        }

        function populatePersonal(p) {
            buildGrid('personalGrid', [
                { label: 'Full Name (as per DL)', value: p.dlName },
                { label: 'Age', value: p.age },
                { label: 'Phone', value: p.phone },
                { label: 'Email', value: p.gmail },
                { label: 'Address', value: p.address },
                { label: 'Education', value: p.education },
                { label: 'Marriage Date', value: p.marriageDate || '—' },
                { label: 'Property Owned', value: p.propertyOwned || '—' },
                { label: 'SSN (last 4)', value: p.ssnLast4 === 'N/A' ? 'N/A' : `***-**-${p.ssnLast4}` },
            ]);
        }
        function populateVisa(p) {
            buildGrid('visaGrid', [
                { label: 'Visa Type', value: p.visaType },
                { label: 'Work Authorization', value: p.workAuthorization },
                { label: 'Green Card Date', value: p.greenCardDate || 'N/A' },
                { label: 'How Got Green Card', value: p.greenCardHow || 'N/A' },
                { label: 'W2 / C2C Preference', value: p.w2C2cPreference || 'Not specified' },
                { label: 'SSN (last 4)', value: p.ssnLast4 === 'N/A' ? 'N/A' : `***-**-${p.ssnLast4}` },
            ]);
        }
        function populateProfessional(p) {
            buildGrid('professionalGrid', [
                { label: 'Last Company', value: p.lastCompany },
                { label: 'Last Project', value: p.lastProject },
                { label: 'Project Overview', value: p.lastProjectOverview, small: true },
                { label: 'Tech Stack Used', value: p.techStack },
                { label: 'Total Experience', value: p.totalExperience },
                { label: 'Total Companies Worked', value: p.totalCompanies },
            ]);
        }
        function populateUS(p) {
            buildGrid('usGrid', [
                { label: 'Came to US Date', value: p.cameToUSDate || 'Not provided' },
                { label: 'First 5 Years – How Got Visa', value: p.firstFiveYearsHow || 'Not provided', small: true },
                { label: 'Places Lived', value: p.placesLived || 'Not provided' },
                { label: 'Current Location', value: p.currentLocation },
                { label: 'Visa Type', value: p.visaType },
                { label: 'Green Card Status', value: p.greenCardDate || 'In process' },
            ]);
        }
        function populateDocs(p) {
            const container = document.getElementById('docsContent');
            if (!container) return;
            const docs = [
                { label: 'DL Copy', file: p.dlCopy, icon: 'bi-file-earmark-person' },
                { label: 'Master Resume', file: p.masterResume, icon: 'bi-file-earmark-text' },
            ];
            let html = `
                <div style="margin-bottom:20px;">
                    <h6 style="font-weight:600;margin-bottom:12px;"><i class="bi bi-folder2-open me-2"></i>Documents</h6>
                    <div class="doc-grid">
            `;
            docs.forEach(d => {
                html += `
                    <a class="doc-item clickable" onclick="handleLinkClick(event, '📄 ${d.file} (simulated download)')">
                        <i class="bi ${d.icon}"></i> ${d.label}
                    </a>
                `;
            });
            html += `
                    </div>
                </div>
                <div>
                    <h6 style="font-weight:600;margin-bottom:12px;"><i class="bi bi-link-45deg me-2"></i>Social &amp; Portfolio</h6>
                    <div class="social-links">
                        ${p.github ? `<a href="${p.github}" target="_blank" class="clickable" onclick="handleLinkClick(event)"><i class="bi bi-github"></i> GitHub</a>` : ''}
                        ${p.linkedin ? `<a href="${p.linkedin}" target="_blank" class="clickable" onclick="handleLinkClick(event)"><i class="bi bi-linkedin"></i> LinkedIn</a>` : ''}
                        ${p.portfolio ? `<a href="${p.portfolio}" target="_blank" class="clickable" onclick="handleLinkClick(event)"><i class="bi bi-browser-chrome"></i> Portfolio</a>` : ''}
                    </div>
                </div>
                <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border-color);">
                    <span style="font-size:0.85rem; color:var(--text-secondary);">
                        <i class="bi bi-info-circle"></i> All documents are stored securely.
                    </span>
                </div>
            `;
            container.innerHTML = html;
        }

        // ─── Click animation for doc & social links ───
        function handleLinkClick(event, message = null) {
            const el = event.currentTarget;
            el.classList.remove('click-pop');
            void el.offsetWidth;
            el.classList.add('click-pop');
            setTimeout(() => {
                el.classList.remove('click-pop');
            }, 300);
            if (message) {
                alert(message);
                event.preventDefault();
            }
        }

        // ───────────────────────────────────────────────────────────────
        //  MODAL (Add / Edit)
        // ───────────────────────────────────────────────────────────────

        const profileModal = new bootstrap.Modal(document.getElementById('profileModal'));
        const addNewBtn = document.getElementById('addNewBtn');
        const saveProfileBtn = document.getElementById('saveProfileBtn');
        const modalTitle = document.getElementById('modalTitle');

        function openEditModal(person) {
            document.getElementById('editId').value = person.id;
            modalTitle.innerHTML = `<i class="bi bi-pencil me-2"></i>Edit Member`;
            document.getElementById('fName').value = person.name || '';
            document.getElementById('fEmail').value = person.gmail || '';
            document.getElementById('fPhone').value = person.phone || '';
            document.getElementById('fAddress').value = person.address || '';
            document.getElementById('fAge').value = person.age || '';
            document.getElementById('fEducation').value = person.education || '';
            document.getElementById('fDlName').value = person.dlName || '';
            document.getElementById('fMarriage').value = person.marriageDate || '';
            document.getElementById('fProperty').value = person.propertyOwned || '';
            document.getElementById('fVisa').value = person.visaType || '';
            document.getElementById('fAuth').value = person.workAuthorization || '';
            document.getElementById('fGcDate').value = person.greenCardDate || '';
            document.getElementById('fGcHow').value = person.greenCardHow || '';
            document.getElementById('fW2').value = person.w2C2cPreference || '';
            document.getElementById('fSsn').value = person.ssnLast4 || '';
            document.getElementById('fLastCompany').value = person.lastCompany || '';
            document.getElementById('fTotalExp').value = person.totalExperience || '';
            document.getElementById('fTotalCompanies').value = person.totalCompanies || '';
            document.getElementById('fLastProject').value = person.lastProject || '';
            document.getElementById('fLastProjectOverview').value = person.lastProjectOverview || '';
            document.getElementById('fTechStack').value = person.techStack || '';
            document.getElementById('fCameUS').value = person.cameToUSDate || '';
            document.getElementById('fFirst5').value = person.firstFiveYearsHow || '';
            document.getElementById('fPlaces').value = person.placesLived || '';
            document.getElementById('fCurrentLoc').value = person.currentLocation || '';
            document.getElementById('fDlCopy').value = person.dlCopy || '';
            document.getElementById('fMasterResume').value = person.masterResume || '';
            document.getElementById('fGithub').value = person.github || '';
            document.getElementById('fLinkedin').value = person.linkedin || '';
            document.getElementById('fPortfolio').value = person.portfolio || '';
            const refs = person.references || [];
            const refText = refs.map(r => `${r.name} | ${r.designation} | ${r.company} | ${r.email || ''} | ${r.phone || ''} | ${r.linkedin || ''}`).join('\n');
            document.getElementById('fReferences').value = refText;
            profileModal.show();
        }

        addNewBtn.addEventListener('click', () => {
            document.getElementById('editId').value = '';
            modalTitle.innerHTML = `<i class="bi bi-person-plus me-2"></i>Add New Member`;
            document.getElementById('profileForm').reset();
            profileModal.show();
        });

        saveProfileBtn.addEventListener('click', () => {
            const editId = document.getElementById('editId').value;
            const name = document.getElementById('fName').value.trim();
            const email = document.getElementById('fEmail').value.trim();
            if (!name || !email) {
                alert('Name and Email are required.');
                return;
            }

            const refText = document.getElementById('fReferences').value;
            const refs = refText.split('\n').filter(line => line.trim() !== '').map(line => {
                const parts = line.split('|').map(s => s.trim());
                return {
                    name: parts[0] || '',
                    designation: parts[1] || '',
                    company: parts[2] || '',
                    email: parts[3] || '',
                    phone: parts[4] || '',
                    linkedin: parts[5] || ''
                };
            });

            const profile = {
                name: name,
                gmail: email,
                phone: document.getElementById('fPhone').value.trim(),
                address: document.getElementById('fAddress').value.trim(),
                age: document.getElementById('fAge').value.trim(),
                education: document.getElementById('fEducation').value.trim(),
                dlName: document.getElementById('fDlName').value.trim(),
                marriageDate: document.getElementById('fMarriage').value.trim(),
                propertyOwned: document.getElementById('fProperty').value.trim(),
                visaType: document.getElementById('fVisa').value.trim(),
                workAuthorization: document.getElementById('fAuth').value.trim(),
                greenCardDate: document.getElementById('fGcDate').value.trim(),
                greenCardHow: document.getElementById('fGcHow').value.trim(),
                w2C2cPreference: document.getElementById('fW2').value.trim(),
                ssnLast4: document.getElementById('fSsn').value.trim(),
                lastCompany: document.getElementById('fLastCompany').value.trim(),
                totalExperience: document.getElementById('fTotalExp').value.trim(),
                totalCompanies: parseInt(document.getElementById('fTotalCompanies').value) || 0,
                lastProject: document.getElementById('fLastProject').value.trim(),
                lastProjectOverview: document.getElementById('fLastProjectOverview').value.trim(),
                techStack: document.getElementById('fTechStack').value.trim(),
                cameToUSDate: document.getElementById('fCameUS').value.trim(),
                firstFiveYearsHow: document.getElementById('fFirst5').value.trim(),
                placesLived: document.getElementById('fPlaces').value.trim(),
                currentLocation: document.getElementById('fCurrentLoc').value.trim(),
                dlCopy: document.getElementById('fDlCopy').value.trim(),
                masterResume: document.getElementById('fMasterResume').value.trim(),
                github: document.getElementById('fGithub').value.trim(),
                linkedin: document.getElementById('fLinkedin').value.trim(),
                portfolio: document.getElementById('fPortfolio').value.trim(),
                references: refs
            };

            if (editId) {
                const idx = teamData.findIndex(p => p.id === parseInt(editId));
                if (idx !== -1) {
                    teamData[idx] = { ...teamData[idx], ...profile };
                    saveData(teamData);
                    renderCards(searchInput.value);
                    if (currentPerson && currentPerson.id === parseInt(editId)) {
                        openProfile(teamData[idx]);
                    }
                }
            } else {
                const newId = teamData.length ? Math.max(...teamData.map(p => p.id)) + 1 : 1;
                profile.id = newId;
                teamData.push(profile);
                saveData(teamData);
                renderCards(searchInput.value);
                openProfile(profile);
            }
            profileModal.hide();
        });

        function deleteMember(id) {
            teamData = teamData.filter(p => p.id !== id);
            saveData(teamData);
            renderCards(searchInput.value);
            if (currentPerson && currentPerson.id === id) {
                closeProfile();
            }
        }

        // ───────────────────────────────────────────────────────────────
        //  THEME TOGGLE
        // ───────────────────────────────────────────────────────────────

        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const themeLabel = document.getElementById('themeLabel');
        let darkMode = localStorage.getItem('theme') === 'dark';

        function applyTheme(dark) {
            document.documentElement.classList.toggle('dark-theme', dark);
            themeIcon.className = dark ? 'bi bi-sun' : 'bi bi-moon-stars';
            themeLabel.textContent = dark ? 'Light' : 'Dark';
            localStorage.setItem('theme', dark ? 'dark' : 'light');
        }

        themeToggle.addEventListener('click', () => {
            darkMode = !darkMode;
            applyTheme(darkMode);
        });

        if (localStorage.getItem('theme') === 'dark') {
            darkMode = true;
            applyTheme(true);
        } else {
            applyTheme(false);
        }

        // ───────────────────────────────────────────────────────────────
        //  SEARCH
        // ───────────────────────────────────────────────────────────────

        searchInput.addEventListener('input', (e) => {
            renderCards(e.target.value);
            if (profilePanel.classList.contains('active')) closeProfile();
        });

        resetSearchBtn.addEventListener('click', () => {
            searchInput.value = '';
            renderCards('');
            if (profilePanel.classList.contains('active')) closeProfile();
        });

        // ───────────────────────────────────────────────────────────────
        //  INIT
        // ───────────────────────────────────────────────────────────────

        renderCards('');
        console.log('🏢 Team Profile Hub – 6 members loaded (added Hridesh Sharma).');
    </script>

</body>

</html>
